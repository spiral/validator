on:
  pull_request:
  push:
    branches:
      - 1.x

name: mutation testing

jobs:
  infection:
    name: Infection (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run Infection (changed lines only)
        if: github.event_name == 'pull_request'
        run: vendor/bin/infection --threads=max --git-diff-lines --git-diff-base=origin/${{ github.base_ref }} --logger-github --ignore-msi-with-no-mutations --no-progress

      - name: Run Infection
        if: github.event_name == 'push'
        run: vendor/bin/infection --threads=max --logger-github --no-progress
